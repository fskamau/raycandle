name: tests
on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: System dependencies for raylib
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev
      - name: Python tools
        run: python -m pip install --upgrade pip setuptools wheel cmake cffi numpy pandas pytz pytest
      - name: Build static raylib 5.5
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git external/raylib
          cmake -S external/raylib -B external/raylib/build -DBUILD_EXAMPLES=OFF -DBUILD_SHARED_LIBS=OFF -DPLATFORM=Desktop -DCMAKE_BUILD_TYPE=Release
          cmake --build external/raylib/build --parallel 2
      - name: Build and install raycandle
        env:
          RAYLIB_ROOT: ${{ github.workspace }}/external/raylib/src
        run: python -m pip install --no-build-isolation .
      - name: Ensure native artifacts are present
        run: |
          test -s raycandle/raycandle.h
          test -s raycandle/libraycandle.so
      - name: Run regression tests
        run: python -m pytest -q
